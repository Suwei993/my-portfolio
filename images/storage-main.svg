<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#F5A623"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2F4B7C"/></marker>
  </defs>
  <rect width="800" height="500" rx="22" fill="#F2F8FD"/>
  <text x="400" y="50" text-anchor="middle" font-size="22" font-weight="700" fill="#1F3358">Home Battery Storage Providing Frequency Regulation</text>
  <text x="400" y="76" text-anchor="middle" font-size="13" fill="#5B6573">Grid-connected control concept · Illustrative / 示意图</text>

  <!-- battery -->
  <rect x="55" y="205" width="110" height="90" rx="12" fill="#fff" stroke="#2F4B7C" stroke-width="3"/>
  <rect x="165" y="236" width="10" height="28" rx="3" fill="#2F4B7C"/>
  <rect x="68" y="220" width="22" height="60" rx="4" fill="#8EC3EE"/>
  <rect x="97" y="220" width="22" height="60" rx="4" fill="#8EC3EE"/>
  <rect x="126" y="220" width="22" height="60" rx="4" fill="#F5A623"/>
  <text x="110" y="325" text-anchor="middle" font-size="14" font-weight="600" fill="#1F3358">Home battery</text>
  <text x="110" y="344" text-anchor="middle" font-size="12" fill="#5B6573">家庭储能</text>

  <!-- inverter -->
  <rect x="265" y="205" width="130" height="90" rx="12" fill="#fff" stroke="#2F4B7C" stroke-width="3"/>
  <text x="330" y="245" text-anchor="middle" font-size="18" font-weight="700" fill="#2F4B7C">DC ⇄ AC</text>
  <path d="M300 268 q8 -16 16 0 t16 0 t16 0" fill="none" stroke="#F5A623" stroke-width="3" stroke-linecap="round"/>
  <text x="330" y="325" text-anchor="middle" font-size="14" font-weight="600" fill="#1F3358">Inverter / PCS</text>
  <text x="330" y="344" text-anchor="middle" font-size="12" fill="#5B6573">储能变流器</text>

  <!-- PCC -->
  <circle cx="470" cy="250" r="9" fill="#2F4B7C"/>
  <text x="470" y="285" text-anchor="middle" font-size="12" fill="#5B6573">PCC</text>

  <!-- house -->
  <path d="M430 150 L470 118 L510 150 Z" fill="#8EC3EE" stroke="#2F4B7C" stroke-width="3" stroke-linejoin="round"/>
  <rect x="440" y="150" width="60" height="42" fill="#fff" stroke="#2F4B7C" stroke-width="3"/>
  <rect x="462" y="164" width="16" height="28" fill="#2F4B7C"/>
  <text x="560" y="160" text-anchor="start" font-size="14" font-weight="600" fill="#1F3358">Household load</text>
  <text x="560" y="178" text-anchor="start" font-size="12" fill="#5B6573">家庭负荷</text>

  <!-- grid pylon -->
  <g stroke="#2F4B7C" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M690 180 L660 300 M690 180 L720 300"/>
    <path d="M672 252 H708 M676 236 H704 M664 288 H716"/>
    <path d="M672 252 L708 288 M708 252 L672 288"/>
    <path d="M668 204 H712"/>
    <path d="M650 204 H730"/>
  </g>
  <text x="690" y="325" text-anchor="middle" font-size="14" font-weight="600" fill="#1F3358">Power grid</text>
  <text x="690" y="344" text-anchor="middle" font-size="12" fill="#5B6573">电网 · 50 Hz</text>

  <!-- power flow arrows -->
  <path d="M182 250 H255" stroke="#F5A623" stroke-width="4" marker-start="url(#ao)" marker-end="url(#ao)"/>
  <path d="M405 250 H455" stroke="#F5A623" stroke-width="4" marker-start="url(#ao)" marker-end="url(#ao)"/>
  <path d="M485 250 H640" stroke="#F5A623" stroke-width="4" marker-start="url(#ao)" marker-end="url(#ao)"/>
  <path d="M470 236 V200" stroke="#F5A623" stroke-width="4" marker-end="url(#ao)"/>
  <text x="560" y="240" text-anchor="middle" font-size="12" fill="#9A6200">charge / discharge</text>

  <!-- control loop -->
  <rect x="265" y="400" width="130" height="56" rx="12" fill="#2F4B7C"/>
  <text x="330" y="424" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Frequency controller</text>
  <text x="330" y="443" text-anchor="middle" font-size="12" fill="#D6E4F5">Δf → ΔP droop · 调频控制</text>
  <path d="M690 360 V428 H405" fill="none" stroke="#2F4B7C" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#ab)"/>
  <text x="560" y="420" text-anchor="middle" font-size="12" fill="#2F4B7C">f measured</text>
  <path d="M272 400 V300" fill="none" stroke="#2F4B7C" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#ab)"/>
  <text x="262" y="372" text-anchor="end" font-size="12" fill="#2F4B7C">P* setpoint</text>

  <!-- legend -->
  <path d="M60 440 H100" stroke="#F5A623" stroke-width="4" marker-end="url(#ao)"/>
  <text x="108" y="444" font-size="12" fill="#5B6573">Power flow</text>
  <path d="M60 466 H100" stroke="#2F4B7C" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#ab)"/>
  <text x="108" y="470" font-size="12" fill="#5B6573">Control signal</text>
</svg>
